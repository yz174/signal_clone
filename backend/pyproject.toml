[project]
name = "signal-clone-backend"
version = "0.1.0"
description = "Secure messaging platform backend (Signal clone)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "python-ulid>=3.0",
    "slowapi>=0.1.9",
    "redis>=5.2",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "websockets>=14.1",
    "pytest-env>=1.7.0",
    "asgi-lifespan>=2.1.0",
    "playwright>=1.61.0",
    "pytest-playwright>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "S", "C4", "SIM", "TC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SIM117"]
"tests/conftest.py" = ["S101", "SIM117", "F401"]
"alembic/env.py" = ["F401"]
"app/db/base.py" = ["RUF012"]
"scripts/*" = ["S603", "S607", "S105", "S310", "SIM115"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = ["slowapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
env = ["JWT_SECRET=test-secret-with-at-least-32-bytes-of-length"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
